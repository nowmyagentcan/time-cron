[package]
name = "time-cron"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Explain cron schedules and list their next runs in any time zone"
repository = "https://github.com/nowmyagentcan/time-cron"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
jiff-tzdb = "0.1.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# jiff-tzdb 0.1.9 on crates.io carries tzdata 2026e; this copy is regenerated from 2026f
# by scripts/vendor-tzdb.sh. Drop the patch once crates.io ships 2026f or newer.
[patch.crates-io]
jiff-tzdb = { path = "vendor/jiff-tzdb" }
